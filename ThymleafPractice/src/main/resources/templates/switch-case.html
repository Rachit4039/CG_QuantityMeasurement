<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>switch case</title>
</head>
<body>
    <h3 th:text="${user.name}"></h3>
<div th:switch = "${user.role}">
    <p th:case = "'Admin'">Admin user</p>
    <p th:case = "'User'">normal user</p>
    <p th:case="*">Defalut case</p>

</div>
</body>
</html>
